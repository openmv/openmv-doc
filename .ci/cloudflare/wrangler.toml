# Deployed by .github/workflows/cloudflare-worker.yml (see README.md).
# Manual: cd .ci/cloudflare && npx wrangler deploy
name = "docs-latest-redirect"
main = "latest-redirect.js"
compatibility_date = "2026-10-01"
workers_dev = false
routes = [
  { pattern = "docs.openmv.io/latest*", zone_name = "openmv.io" },
  # No wildcard: matches only the site root, not /robots.txt, /llms.txt, etc.
  { pattern = "docs.openmv.io/", zone_name = "openmv.io" },
]
